name: pdfconvertorapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  file_picker: ^8.3.2
  pdf: ^3.11.3
  printing: ^5.14.2
  image: ^4.5.4
  crop_your_image: ^1.1.0
  file_saver: ^0.3.1
  google_mlkit_text_recognition: ^0.14.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - PDF_icon.jpg

flutter_launcher_icons:
  image_path: "PDF_icon.jpg"
  android: true
  ios: true
  web:
    generate: true
    image_path: "PDF_icon.jpg"
    background_color: "#FFFFFF"
    theme_color: "#B71C1C"
